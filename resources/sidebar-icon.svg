<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
  stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Center comparison divider line -->
  <line x1="12" y1="4.5" x2="12" y2="13.5" stroke-dasharray="1.5 1.5" stroke-width="1.2"
    opacity="0.6" />

  <!-- Base commit node -->
  <circle cx="12" cy="19" r="2" />

  <!-- Branch curves splitting off base -->
  <path d="M12 17 C12 14.5, 7 14, 7 11.5 V5" />
  <path d="M12 17 C12 14.5, 17 14, 17 11.5 V5" />

  <!-- Git nodes on branches -->
  <circle cx="7" cy="11" r="1.5" />
  <circle cx="7" cy="6.5" r="1.5" />
  <circle cx="17" cy="11" r="1.5" />
  <circle cx="17" cy="6.5" r="1.5" />

  <!-- Plus symbol on left branch -->
  <line x1="7" y1="2" x2="7" y2="4" stroke-width="1.3" />
  <line x1="6" y1="3" x2="8" y2="3" stroke-width="1.3" />

  <!-- Minus symbol on right branch -->
  <line x1="16" y1="3" x2="18" y2="3" stroke-width="1.3" />
</svg>